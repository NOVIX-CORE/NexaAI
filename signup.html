<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ثبت‌نام | NexaAI</title><link rel="stylesheet" href="css/style.css"></head><body><main class="hero" style="min-height:100vh;display:grid;place-items:center"><div class="card" style="width:min(470px,100%)"><a class="brand" href="index.html"><span class="brand-mark"></span>NexaAI</a><h1 style="font-size:32px;margin-top:30px">فضای کاری خود را بسازید</h1><p class="lead" style="font-size:14px">شروع رایگان، بدون کارت بانکی.</p><form class="form" data-auth><label class="field">نام و نام خانوادگی<input required placeholder="نام شما"></label><label class="field">ایمیل کاری<input type="email" required placeholder="you@company.com"></label><label class="field">رمز عبور<input name="password" type="password" minlength="6" required placeholder="رمز قوی بسازید"><div class="progress"><i data-strength style="width:0"></i></div></label><label class="field">تکرار رمز عبور<input name="password-confirm" type="password" minlength="6" required placeholder="تکرار رمز عبور"></label><label style="font-size:13px;color:var(--muted)"><input type="checkbox" required> با <a href="contact.html" style="color:var(--cyan)">شرایط استفاده</a> موافقم.</label><button class="btn btn-primary">ساخت حساب</button></form><div class="divider"></div><p class="center" style="font-size:13px;color:var(--muted)">قبلاً ثبت‌نام کرده‌اید؟ <a href="login.html" style="color:var(--cyan)">وارد شوید</a></p></div></main><div class="toast"></div><script src="js/main.js"></script><script src="js/forms.js"></script></body></html>
